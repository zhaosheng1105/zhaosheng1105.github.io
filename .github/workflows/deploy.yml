name: Deploy site
on:
  push:
    branches: [main, master]
    paths: ["homepage/**", "scripts/validate-homepage.cjs", ".github/workflows/deploy.yml"]
  pull_request:
    branches: [main, master]
    paths: ["homepage/**", "scripts/validate-homepage.cjs", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: academic-homepage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate the approved homepage
        run: node scripts/validate-homepage.cjs
      - name: Deploy approved Academic Pages files
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: homepage
